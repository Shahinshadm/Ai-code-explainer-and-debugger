<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI Code Explainer &amp; Debugger</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main class="shell">
  <header><div class="eyebrow">DEVELOPER TOOLKIT</div>
    <h1>Understand your code.<br><span>Fix what’s not working.</span></h1>
    <p class="intro">Paste a snippet to get a clear explanation or a focused debugging review.</p>
  </header>
  <section class="workspace" aria-label="Code analysis workspace">
    <div class="controls"><label>Language<select id="language"><option>python</option><option>javascript</option><option>typescript</option><option>java</option><option>go</option><option>other</option></select></label>
      <div class="actions"><button class="secondary" data-task="explain">Explain code</button><button class="primary" data-task="debug">Debug code <span>→</span></button></div>
    </div>
    <label class="sr-only" for="code">Code to analyze</label>
    <textarea id="code" spellcheck="false">def average(values):
    total = 0
    for value in values:
        total += value
    return total / len(values)

print(average([4, 8, 12]))</textarea>
    <div class="result-head"><strong>Analysis</strong><span id="status">Ready</span></div>
    <article id="result" class="result"><p>Your result will appear here. Choose Explain code or Debug code to begin.</p></article>
  </section>
  <footer>Demo mode works without an API key · Configure <code>.env</code> for AI analysis</footer>
</main>
<script>
const box=document.querySelector('#code'), result=document.querySelector('#result'), status=document.querySelector('#status');
document.querySelectorAll('[data-task]').forEach(button=>button.addEventListener('click',async()=>{
  status.textContent='Analyzing…'; result.textContent='Working on your code…';
  document.querySelectorAll('button').forEach(x=>x.disabled=true);
  try {
    const res=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:box.value,task:button.dataset.task,language:document.querySelector('#language').value})});
    const data=await res.json(); if(!res.ok) throw Error(data.error||'Analysis failed');
    result.innerHTML=render(data.result); status.textContent=data.mode==='ai'?'AI analysis':'Demo analysis';
  } catch(e) { result.textContent=e.message; status.textContent='Could not analyze'; }
  finally { document.querySelectorAll('button').forEach(x=>x.disabled=false); }
}));
function render(text) {
  const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let s=esc(text).replace(/```([\s\S]*?)```/g,(_,b)=>'<pre><code>'+b.trim()+'</code></pre>');
  return s.split(/\n\s*\n/).map(b=>b.startsWith('### ')?'<h3>'+b.slice(4)+'</h3>':b.split('\n').every(x=>x.startsWith('- '))?'<ul>'+b.split('\n').map(x=>'<li>'+x.slice(2)+'</li>').join('')+'</ul>':b.startsWith('<pre>')?b:'<p>'+b.replace(/\n/g,'<br>').replace(/`([^`]+)`/g,'<code>$1</code>')+'</p>').join('');
}
</script>
</body></html>
